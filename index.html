<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢字れんしゅう</title>
<meta name="description" content="中学入試によく出る漢字の読み・書き順・熟語・意味を学べるアプリ">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="漢字れんしゅう">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8ef;
  --card: #ffffff;
  --ink: #2d2a26;
  --sub: #7a7268;
  --line: #eadfce;
  --accent: #e2574c;
  --accent-2: #2f7dd1;
  --ok: #2e9d5b;
  --ng: #d6453b;
  --warn: #e5a422;
  --soft: #fff1dd;
  --kfont: 'Klee One', 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', 'YuKyokasho', 'Hiragino Mincho ProN', serif;
  --ufont: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ufont);
  font-weight: 500;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent-2); }
button { font: inherit; color: inherit; cursor: pointer; }
button, a { touch-action: manipulation; }
canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
header.top {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0 12px;
}
header.top h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 800; letter-spacing: .02em; }
header.top h1 a { color: inherit; text-decoration: none; }
.back {
  border: 0; background: var(--card); border-radius: 999px; padding: 6px 14px;
  box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line) inset;
}
.k { font-family: var(--kfont); font-weight: 600; }
.card {
  background: var(--card); border-radius: 18px; padding: 16px;
  box-shadow: 0 2px 0 var(--line), 0 0 0 1px var(--line) inset;
  margin-bottom: 14px;
}
h2 { font-size: 17px; margin: 4px 0 10px; font-weight: 800; }
h3 { font-size: 15px; margin: 14px 0 6px; font-weight: 800; color: var(--sub); }
.muted { color: var(--sub); font-size: 13px; }

/* ホーム */
.hero { text-align: center; padding: 18px 8px 8px; }
.hero .big { font-family: var(--kfont); font-size: 44px; font-weight: 600; letter-spacing: .1em; line-height: 1.2; }
.hero .big span { color: var(--accent); }
.hero p { margin: 6px 0 0; color: var(--sub); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stat { background: var(--card); border-radius: 14px; padding: 10px 6px; text-align: center; box-shadow: 0 0 0 1px var(--line) inset; }
.stat b { display: block; font-size: 22px; font-weight: 800; }
.stat small { color: var(--sub); font-size: 12px; }
.menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.menu button {
  border: 0; text-align: left; background: var(--card); border-radius: 16px; padding: 14px 14px 12px;
  box-shadow: 0 3px 0 var(--line), 0 0 0 1px var(--line) inset; position: relative; min-height: 88px;
  transition: transform .08s;
}
.menu button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line) inset; }
.menu .ic { font-family: var(--kfont); font-size: 26px; font-weight: 600; line-height: 1; display: inline-block; width: 40px; height: 40px; border-radius: 12px; text-align: center; padding-top: 7px; color: #fff; margin-bottom: 6px; }
.menu b { display: block; font-size: 15px; font-weight: 800; }
.menu small { display: block; color: var(--sub); font-size: 12px; line-height: 1.4; }
.menu .wide { grid-column: span 2; }
.badge { position: absolute; top: 10px; right: 12px; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 800; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  border: 0; border-radius: 999px; padding: 6px 14px; background: var(--soft); font-size: 14px;
}
.seg button.on { background: var(--ink); color: #fff; }
.setrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.setrow > span { min-width: 92px; font-size: 14px; color: var(--sub); }

/* じてん */
.search { width: 100%; font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
.grid a {
  display: block; text-align: center; text-decoration: none; color: var(--ink); background: var(--card); border-radius: 12px;
  font-family: var(--kfont); font-weight: 600; font-size: 30px; padding: 6px 0 4px; position: relative;
  box-shadow: 0 2px 0 var(--line), 0 0 0 1px var(--line) inset;
}
.grid a .lv { display: block; font-family: var(--ufont); font-size: 10px; color: var(--sub); line-height: 1.2; }
.dot { position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; }
.dot.g { background: var(--ok); } .dot.y { background: var(--warn); } .dot.r { background: var(--ng); }

.detail { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
@media (max-width: 640px) { .detail { grid-template-columns: 1fr; } }
.player { text-align: center; }
.ksvg { width: 100%; max-width: 280px; aspect-ratio: 1; display: block; margin: 0 auto; background: #fff; border-radius: 12px; }
.ksvg .grid-l { stroke: #f0c9b8; stroke-width: .5; stroke-dasharray: 2 2; fill: none; }
.ksvg .frame { stroke: #e8b7a2; stroke-width: 1; fill: none; }
.ksvg .ghost path { stroke: #e9e4dc; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ksvg .ink path { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ksvg .ink path.cur { stroke: var(--accent); }
.ksvg .ink path.hide { opacity: 0; }
.ksvg .nums text { font-size: 7px; fill: var(--accent-2); font-family: var(--ufont); font-weight: 800; }
.ksvg .hl path { stroke: var(--accent); stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.pbtns { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.btn {
  border: 0; border-radius: 12px; padding: 10px 16px; background: var(--card); font-weight: 800;
  box-shadow: 0 3px 0 var(--line), 0 0 0 1px var(--line) inset;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line) inset; }
.btn.pri { background: var(--accent); color: #fff; box-shadow: 0 3px 0 #b33e35; }
.btn.blue { background: var(--accent-2); color: #fff; box-shadow: 0 3px 0 #1f5c9e; }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.info dl { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; margin: 0; }
.info dt { color: var(--sub); font-size: 13px; padding-top: 3px; }
.info dd { margin: 0; font-size: 16px; }
.okuri { color: var(--sub); }
.rd { display: inline-block; margin-right: 10px; }
.words { list-style: none; padding: 0; margin: 0; }
.words li { padding: 10px 0; border-top: 1px dashed var(--line); }
.words li:first-child { border-top: 0; }
.words .w { font-family: var(--kfont); font-weight: 600; font-size: 22px; margin-right: 8px; }
.words .r { color: var(--accent-2); font-size: 14px; }
.words .m { font-size: 14px; }
.words .ex { font-size: 13px; color: var(--sub); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-block; font-family: var(--kfont); font-weight: 600; font-size: 22px; padding: 0 10px; border-radius: 10px;
  background: var(--soft); color: var(--ink); text-decoration: none;
}
span.chip { opacity: .6; }
.navrow { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }

/* クイズ */
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar { flex: 1; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.qtype { font-size: 13px; color: var(--sub); }
.qtext { font-size: 15px; margin-bottom: 10px; }
.qbig { font-family: var(--kfont); font-weight: 600; font-size: 46px; text-align: center; line-height: 1.3; margin: 6px 0; word-break: keep-all; }
.qsent { font-family: var(--kfont); font-weight: 600; font-size: 24px; line-height: 2; margin: 6px 0 4px; }
.qsent u { text-decoration: none; border-bottom: 3px solid var(--accent); padding: 0 2px; }
.qsent .kata { color: var(--accent); }
.qhint { font-size: 13px; color: var(--sub); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.choices.one { grid-template-columns: 1fr; }
.choices button {
  border: 0; background: var(--card); border-radius: 14px; padding: 12px 10px; font-size: 20px; min-height: 60px;
  box-shadow: 0 3px 0 var(--line), 0 0 0 2px var(--line) inset; position: relative;
}
.choices.kfont button { font-family: var(--kfont); font-weight: 600; font-size: 26px; }
.choices.text button { font-size: 14px; text-align: left; line-height: 1.5; }
.choices button .n { position: absolute; top: 4px; left: 8px; font-size: 11px; color: var(--sub); font-family: var(--ufont); }
.choices button.ok { box-shadow: 0 3px 0 #1e7743, 0 0 0 3px var(--ok) inset; background: #e9f8ef; }
.choices button.ng { box-shadow: 0 3px 0 #a3322a, 0 0 0 3px var(--ng) inset; background: #fdeceb; }
.choices button[disabled] { cursor: default; }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--soft); }
.fb .mark { font-size: 22px; font-weight: 800; }
.fb .mark.ok { color: var(--ok); } .fb .mark.ng { color: var(--ng); }
.fb .ans { font-family: var(--kfont); font-weight: 600; font-size: 22px; }
.fb .exp { font-size: 14px; margin-top: 4px; }
.fb .ksvg { max-width: 160px; }
.nextrow { display: flex; justify-content: flex-end; margin-top: 12px; gap: 8px; }
.qsvg { max-width: 220px; }

/* 書くモード */
.padwrap { margin-top: 12px; text-align: center; }
.pad { touch-action: none; background: #fff; border-radius: 12px; box-shadow: 0 0 0 2px var(--line) inset; max-width: 100%; }

/* なぞり書き */
.practice { position: relative; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 1; }
.practice .ksvg { position: absolute; inset: 0; max-width: none; }
.practice canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; border-radius: 12px; }
.pmsg { text-align: center; min-height: 32px; font-weight: 800; margin-top: 8px; font-size: 17px; }
.pmsg.ok { color: var(--ok); } .pmsg.ng { color: var(--ng); }
.practice .ksvg.noguide .ghost { display: none; }
.ksvg .hint path { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; opacity: .8; }

/* 結果 */
.score { text-align: center; padding: 10px 0; }
.score b { font-size: 48px; font-weight: 800; color: var(--accent); }
.rlist { list-style: none; padding: 0; margin: 0; }
.rlist li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.rlist li:first-child { border-top: 0; }
.rlist .m { font-weight: 800; width: 22px; flex: none; }
.rlist .m.ok { color: var(--ok); } .rlist .m.ng { color: var(--ng); }
.rlist .a { font-family: var(--kfont); font-weight: 600; font-size: 18px; }
footer { text-align: center; color: var(--sub); font-size: 12px; margin-top: 24px; }
footer a { color: var(--sub); }
.empty { text-align: center; color: var(--sub); padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="back" id="backBtn" hidden>← もどる</button>
    <h1><a href="#/">漢字れんしゅう</a></h1>
  </header>
  <main id="app"></main>
  <footer>
    書き順データ：<a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>（CC BY-SA 3.0）
  </footer>
</div>
<svg id="sampler" width="0" height="0" style="position:absolute;visibility:hidden" viewBox="0 0 109 109"><path id="samplerPath" d="M0,0"/></svg>
<script src="js/data.js"></script>
<script src="js/data-extra.js"></script>
<script src="js/strokes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
